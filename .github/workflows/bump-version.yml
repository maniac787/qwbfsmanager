name: Bump version

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-version-main
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version and trigger release
    runs-on: ubuntu-latest
    # Avoid loops: commits from github-actions[bot] must not re-enter.
    if: ${{ github.event.head_commit.author.name != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: bump
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x .github/scripts/bump-version.sh
          .github/scripts/bump-version.sh

      - name: Commit, tag and push
        if: ${{ steps.bump.outputs.skip != '1' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qwbfs/qwbfs.pro CHANGELOG.md
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag "${TAG}"
          git push origin HEAD:main
          git push origin "${TAG}"

      # GITHUB_TOKEN tag pushes do not trigger release.yml; dispatch it explicitly
      # so Linux .deb and Windows .zip are both published.
      - name: Trigger release workflow
        if: ${{ steps.bump.outputs.skip != '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          gh workflow run release.yml --ref main -f tag="${TAG}"
          echo "Triggered release.yml for ${TAG}"
