name: Bump version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bump-version-main
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version and tag
    runs-on: ubuntu-latest
    # Avoid loops: commits from github-actions[bot] must not re-enter.
    if: ${{ github.event.head_commit.author.name != 'github-actions[bot]' }}
    outputs:
      skip: ${{ steps.bump.outputs.skip }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: bump
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x .github/scripts/bump-version.sh
          .github/scripts/bump-version.sh

      - name: Commit, tag and push
        if: ${{ steps.bump.outputs.skip != '1' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qwbfs/qwbfs.pro CHANGELOG.md
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag "${TAG}"
          git push origin HEAD:main
          git push origin "${TAG}"

      - name: Create source archive
        if: ${{ steps.bump.outputs.skip != '1' }}
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          ARCHIVE="qwbfsmanager-${TAG}-src.tar.gz"
          git archive --format=tar.gz --prefix="qwbfsmanager-${TAG}/" -o "${ARCHIVE}" "${TAG}"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: ${{ steps.bump.outputs.skip != '1' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.ARCHIVE }}
          fail_on_unmatched_files: true
          # Same-workflow publish: GITHUB_TOKEN pushes do not trigger release.yml
