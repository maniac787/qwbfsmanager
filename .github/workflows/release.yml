name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Linux .deb
    runs-on: ubuntu-latest
    outputs:
      deb_name: ${{ steps.deb.outputs.deb_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            qmake6 \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-l10n-tools \
            pkg-config \
            libssl-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev

      - name: Build .deb package
        id: deb
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x .github/scripts/build-deb.sh
          .github/scripts/build-deb.sh "${GITHUB_REF_NAME}"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: ${{ steps.deb.outputs.deb_path }}
          if-no-files-found: error

  build-windows:
    name: Build Windows zip
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      zip_name: ${{ steps.win.outputs.zip_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-openssl
            zip

      - name: Build Windows package
        id: win
        run: |
          chmod +x .github/scripts/build-windows.sh
          .github/scripts/build-windows.sh "${GITHUB_REF_NAME}"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ steps.win.outputs.zip_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-deb, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist

      - name: Create source archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="qwbfsmanager-${TAG}-src.tar.gz"
          mkdir -p dist
          git archive --format=tar.gz --prefix="qwbfsmanager-${TAG}/" -o "dist/${ARCHIVE}" "${TAG}"
          echo "SRC_ARCHIVE=dist/${ARCHIVE}" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ${{ env.SRC_ARCHIVE }}
            dist/*.deb
            dist/*.zip
          fail_on_unmatched_files: true
