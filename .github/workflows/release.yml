name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (for example v1.4.2)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  meta:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "$TAG" =~ ^v ]]; then
            echo "Tag must look like v1.2.3 (got: ${TAG})" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

  build-deb:
    name: Build Linux .deb
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      deb_name: ${{ steps.deb.outputs.deb_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            qmake6 \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-l10n-tools \
            pkg-config \
            libssl-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev

      - name: Build .deb package
        id: deb
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x .github/scripts/build-deb.sh
          .github/scripts/build-deb.sh "${{ needs.meta.outputs.tag }}"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: ${{ steps.deb.outputs.deb_path }}
          if-no-files-found: error

  build-windows:
    name: Build Windows zip
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      zip_name: ${{ steps.makezip.outputs.zip_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-openssl
            zip

      - name: Build Windows package
        id: win
        run: |
          chmod +x .github/scripts/build-windows.sh
          .github/scripts/build-windows.sh "${{ needs.meta.outputs.tag }}"

      - name: Debug: show dist contents
        run: |
          echo "PWD: $(pwd)"
          ls -la || true
          ls -la dist || true
          ls -la dist/* || true

      - name: Create Windows ZIP
        id: makezip
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -e
          mkdir -p dist
          # remove leading 'v' from tag to match existing naming like 1.5.1
          VERSION=${TAG#v}
          ZIP_NAME="qwbfsmanager-${VERSION}-win64.zip"
          WIN_DIR="dist/qwbfsmanager-${VERSION}-win64"
          if [ ! -d "$WIN_DIR" ]; then
            echo "Directory $WIN_DIR not found, trying to locate any win64 output..."
            WIN_DIR=$(find dist -maxdepth 1 -type d -name "qwbfsmanager*-win64" | head -n 1)
            if [ -z "$WIN_DIR" ]; then
              echo "ERROR: cannot find Windows build output in dist"; ls -la dist || true; exit 1
            fi
          fi
          echo "Creating dist/$ZIP_NAME from $WIN_DIR"
          zip -r "dist/$ZIP_NAME" "$WIN_DIR"
          echo "zip_name=dist/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          ls -la "dist/$ZIP_NAME"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ steps.makezip.outputs.zip_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [meta, build-deb, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist

      - name: Create source archive
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          ARCHIVE="qwbfsmanager-${TAG}-src.tar.gz"
          mkdir -p dist
          git archive --format=tar.gz --prefix="qwbfsmanager-${TAG}/" -o "dist/${ARCHIVE}" "${TAG}"
          echo "SRC_ARCHIVE=dist/${ARCHIVE}" >> "$GITHUB_ENV"
          ls -lh dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.meta.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            ${{ env.SRC_ARCHIVE }}
            dist/*.deb
            dist/*.zip
          fail_on_unmatched_files: true
